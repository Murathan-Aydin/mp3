services:
  mp3downloader:
    build: .
    # Coolify gère le domaine + HTTPS via son reverse-proxy : le port 8756 est
    # seulement exposé au proxy, pas publié sur l'hôte (évite les conflits de port).
    # Domaine Coolify à renseigner : https://mp3.ton-domaine.fr:8756
    # En local (hors Coolify), remplace "expose" par : ports: ["8756:8756"]
    expose:
      - "8756"
    environment:
      - HOST=0.0.0.0
      - PORT=8756
      - DOWNLOAD_DIR=/app/download
      - COOKIES_FILE=/app/config/cookies.txt
      # Cookies YouTube encodés en base64 (voir README) : à renseigner dans
      # Coolify > Environment Variables. Écrits dans COOKIES_FILE au démarrage.
      - YT_COOKIES_B64=${YT_COOKIES_B64:-}
      # Mot de passe demandé pour envoyer des cookies depuis la page (conseillé)
      - COOKIES_PASSWORD=${COOKIES_PASSWORD:-}
      # Propriétaire des MP3 sur l'hôte (ubuntu = 1000:1000) : sinon ils seraient à root
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      # MP3 déposés directement dans la bibliothèque Navidrome (sous-dossier YouTube),
      # donc visibles dans Navidrome / Amperfy. Hors serveur, remplace par
      # un chemin local, ex. ./download:/app/download
      - /srv/media/music/YouTube:/app/download
      # Cookies YouTube (persistent entre les redéploiements)
      - mp3-config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8756/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mp3-config:
