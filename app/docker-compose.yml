services:
  mp3downloader:
    build: .
    # Coolify gère le domaine + HTTPS via son reverse-proxy : le port 8756 est
    # seulement exposé au proxy, pas publié sur l'hôte (évite les conflits de port).
    # Domaine Coolify à renseigner : https://mp3.ton-domaine.fr:8756
    # En local (hors Coolify), remplace "expose" par : ports: ["8756:8756"]
    expose:
      - "8756"
    environment:
      - HOST=0.0.0.0
      - PORT=8756
      - DOWNLOAD_DIR=/app/download
      - COOKIES_FILE=/app/cookies.txt
    volumes:
      # Les MP3 téléchargés persistent hors du conteneur
      - mp3-downloads:/app/download
      # Cookies YouTube : sur Coolify, ajoute plutôt un "File Mount" (Storages)
      # vers /app/cookies.txt avec le contenu de tes cookies (voir README).
      # En local, décommente la ligne suivante et place un cookies.txt à côté :
      # - ./cookies.txt:/app/cookies.txt:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8756/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mp3-downloads:
